{% extends "base.html" %}{% block content %}<h2>Payments</h2><div class="card mb-4"><div class="card-body"><h5>Record payment</h5><form method="post" class="row g-2"><div class="col-md-4"><select class="form-select" name="invoice_id" required><option value="">Unpaid invoice</option>{% for i in invoices %}<option value="{{ i.id }}">{{ i.invoice_number }} — ₹{{ i.total }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required></div><div class="col-md-2"><select class="form-select" name="method"><option>UPI</option><option>Cash</option><option>Bank transfer</option><option>Card</option></select></div><div class="col-md-2"><input class="form-control" name="reference" placeholder="Reference"></div><div class="col-md-2"><button class="btn btn-primary w-100">Record</button></div></form></div></div>
<div class="card"><div class="card-body"><h5>Payment history</h5><table class="table"><tr><th>Invoice</th><th>Amount</th><th>Method</th><th>Reference</th><th>Date</th></tr>{% for p in payments %}<tr><td>{{ p.invoice_number }}</td><td>₹{{ '%.2f'|format(p.amount) }}</td><td>{{ p.method }}</td><td>{{ p.reference }}</td><td>{{ p.payment_date }}</td></tr>{% else %}<tr><td colspan="5">No payments.</td></tr>{% endfor %}</table></div></div>{% endblock %}
