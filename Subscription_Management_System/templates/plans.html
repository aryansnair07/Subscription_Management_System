{% extends "base.html" %}{% block content %}<h2>Subscription plans</h2><div class="row g-4"><div class="col-lg-4"><div class="card"><div class="card-body"><h5>Create plan</h5><form method="post"><label class="form-label">Product</label><select class="form-select mb-2" name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select>
<label class="form-label">Plan name</label><input class="form-control mb-2" name="name" required><label class="form-label">Frequency</label><select class="form-select mb-2" name="frequency">{% for f in ['daily','weekly','monthly','yearly'] %}<option>{{ f }}</option>{% endfor %}</select>
<label class="form-label">Price (₹)</label><input class="form-control mb-2" type="number" step="0.01" min="0" name="price" required><label class="form-label">Minimum quantity</label><input class="form-control mb-3" type="number" min="1" value="1" name="min_quantity"><button class="btn btn-primary">Create plan</button></form></div></div></div>
<div class="col-lg-8"><div class="card"><div class="card-body"><h5>Available plans</h5><table class="table"><tr><th>Plan</th><th>Product</th><th>Frequency</th><th>Price</th></tr>{% for p in plans %}<tr><td>{{ p.name }}</td><td>{{ p.product_name }}</td><td>{{ p.frequency }}</td><td>₹{{ '%.2f'|format(p.price) }}</td></tr>{% else %}<tr><td colspan="4">No plans yet.</td></tr>{% endfor %}</table></div></div></div></div>{% endblock %}
