{% extends "base.html" %}{% block content %}<h2>Quotations</h2><div class="card mb-4"><div class="card-body"><form method="post" class="row g-2"><div class="col-md-4"><select class="form-select" name="customer_id" required><option value="">Customer</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-4"><select class="form-select" name="plan_id" required><option value="">Plan</option>{% for p in plans %}<option value="{{ p.id }}">{{ p.name }} · ₹{{ p.price }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" type="date" name="valid_until"></div><div class="col-md-2"><button class="btn btn-primary w-100">Create quote</button></div></form></div></div>
<div class="card"><div class="card-body"><table class="table"><tr><th>Quote</th><th>Customer</th><th>Amount</th><th>Status</th><th>Valid until</th></tr>{% for q in quotations %}<tr><td>{{ q.quote_number }}</td><td>{{ q.customer_name }}</td><td>₹{{ '%.2f'|format(q.amount) }}</td><td>{{ q.status }}</td><td>{{ q.valid_until or '—' }}</td></tr>{% else %}<tr><td colspan="5">No quotations.</td></tr>{% endfor %}</table></div></div>{% endblock %}
